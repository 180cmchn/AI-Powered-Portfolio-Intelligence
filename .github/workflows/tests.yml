name: Local application tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser fixture group
        id: browser-fixtures
        continue-on-error: true
        run: npm run test:browser:iteration
      - name: Browser production group
        id: browser-production
        continue-on-error: true
        run: npm run test:browser:production
      - name: Browser forecast group
        id: browser-forecast
        continue-on-error: true
        run: npm run test:browser:seventh
      - name: Browser daily configuration group
        id: browser-ninth
        continue-on-error: true
        run: npm run test:browser:ninth
      - name: Browser task/report interaction group
        id: browser-tenth
        continue-on-error: true
        run: npm run test:browser:tenth
      - name: Require all browser groups
        if: always()
        env:
          FIXTURES: ${{ steps.browser-fixtures.outcome }}
          PRODUCTION: ${{ steps.browser-production.outcome }}
          FORECAST: ${{ steps.browser-forecast.outcome }}
          NINTH: ${{ steps.browser-ninth.outcome }}
          TENTH: ${{ steps.browser-tenth.outcome }}
        run: test "$FIXTURES" = success && test "$PRODUCTION" = success && test "$FORECAST" = success && test "$NINTH" = success && test "$TENTH" = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore
