name: Local application tests
on: [push, pull_request]
env:
  PYTHON_DOTENV_DISABLED: '1'
  QUOTE_PROVIDER: manual
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [iteration, production, seventh, ninth, tenth, eleventh, twelfth, twelfth-select]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser group
        env:
          PYTHON: python
        run: npm run test:browser:${{ matrix.group }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.group }}-evidence
          path: test-results/
          if-no-files-found: ignore
  tests:
    # Any failure, cancellation or skip remains a failed required check.
    if: always()
    needs: [python, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require Python and every browser group
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$PYTHON_RESULT" = success && test "$BROWSER_RESULT" = success
